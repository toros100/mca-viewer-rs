[package]
name = "mca_viewer_rs"
version = "0.1.0"
edition = "2024"
default-run = "mca_viewer_rs"

[features]
cautious_unsafe = []

[[bin]]
name = "sim"

[[bin]]
name = "headless"

[dependencies]
nbt = {path = "../nbt", features = ["bumpalo"]}
mca_tools = {path = "../mca_tools/"}

slint = {version = "~1.18", default-features = false, features = [
"compat-1-2",
"unstable-wgpu-30",
"renderer-femtovg-wgpu",
"backend-winit-wayland",
"live-preview",
"raw-window-handle-06"
]}

nucleo-matcher = "0.3"
vello = {version = "~0.11", default-features = false, features = ["wgpu"]}
parley = "0.12"
bytemuck = {version = "1.25", features = ["derive"]}
serde = "1"
clap = {version = "4.6", features = ["derive"]}
toml = "1.1"
rustc-hash = "2.1.2"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
parking_lot = "0.13"
static_assertions = "1"
anyhow = "1"
thiserror = "2"
rfd = "0.17"
jiff = "0.2"
pollster = "1"
image = "0.25"

[dev-dependencies]
rand = "0.10.1"

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"
